name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: 后端编译与测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: job_agent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 初始化数据库
        run: |
          mysql -h 127.0.0.1 -uroot -proot123456 < deploy/sql/schema.sql
          mysql -h 127.0.0.1 -uroot -proot123456 job_agent < deploy/sql/data.sql

      - name: 编译并运行单元测试
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: root123456
          REDIS_HOST: 127.0.0.1
        run: mvn -B clean test

      - name: 打包
        working-directory: backend
        run: mvn -B package -DskipTests

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: frontend
        run: npm install

      - name: 构建
        working-directory: frontend
        run: npm run build
