# 生产环境：关闭 SQL 日志，打开大模型，敏感配置全部来自环境变量
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: warn
    com.campus.jobagent: info
  file:
    name: ./logs/job-agent.log

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
