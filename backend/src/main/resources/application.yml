server:
  port: 8443
  ssl:
    key-store: keystore.p12
    key-store-password: 123456
    key-store-type: PKCS12
    key-alias: jobagent


spring:
  application:
    name: job-agent-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:job_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      pool-name: JobAgentHikariPool
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mail:
    host: smtp.qq.com
    port: 465
    username: 1183385627@qq.com
    password: mmmssrumwvlvhiid
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # 生产环境务必通过环境变量覆盖，长度不少于 32 字节
    secret: ${JWT_SECRET:job-agent-course-design-secret-key-2024-please-change-me}
    expire-minutes: 720
    issuer: job-agent
  ai:
    # false = 使用内置本地规则引擎；true = 调用 OpenAI 兼容的大模型服务
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:deepseek}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    chat-path: ${AI_CHAT_PATH:/v1/chat/completions}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    timeout: 60s
    temperature: 0.3
    max-tokens: 2048
  storage:
    local-path: ${UPLOAD_PATH:./data/upload}
    url-prefix: /files
    max-size-mb: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: info
    com.campus.jobagent: debug

